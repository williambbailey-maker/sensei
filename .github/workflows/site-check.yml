name: Live site check

# Runs in the cloud (open network) and reports what sensei.nyc is actually
# serving right now: which build, the icon tags, the footer disclaimer, the
# desktop layout and the service worker cache version. The interactive
# sessions can't reach the live domain, so this is how they verify a deploy.
# Read-only: fetches public URLs, changes nothing.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to check"
        required: false
        default: "sensei.nyc"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ github.event.inputs.host || 'sensei.nyc' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: DNS
        run: |
          echo "== $HOST"; dig +short "$HOST" A; dig +short "$HOST" CNAME
          echo "== www.$HOST"; dig +short "www.$HOST" A; dig +short "www.$HOST" CNAME

      - name: Home page
        run: |
          set +e
          B="https://$HOST"
          C='-sS -H Cache-Control:no-cache -H Pragma:no-cache'
          echo "== headers /"
          curl $C -D - -o home.html "$B/" | grep -iE '^(HTTP|age|cache-control|x-vercel-id|x-vercel-cache|last-modified|etag|server|date)'
          echo "== head icon/theme tags"
          grep -oE '<link rel="(icon|apple-touch-icon|manifest)"[^>]*>|<meta name="theme-color"[^>]*>' home.html
          echo "== app bundles"
          grep -oE '/assets/[^"]+\.(js|css)' home.html | sort -u | tee assets.txt
          for a in $(cat assets.txt); do curl $C -o "$(basename $a)" "$B$a"; done
          echo "== markers in bundles"
          echo "new disclaimer (not affiliated):  $(cat index-*.js 2>/dev/null | grep -c 'not affiliated with any dispensary')"
          echo "old disclaimer (New York State):  $(cat index-*.js 2>/dev/null | grep -c 'is a guide for adults 21 and over in New York State')"
          echo "desktop layout (home-grid css):   $(cat index-*.css 2>/dev/null | grep -c 'home-grid')"
          echo "directions link in app:           $(cat index-*.js 2>/dev/null | grep -c 'Directions in Google Maps')"
          echo "envelope mailto in app:           $(cat index-*.js 2>/dev/null | grep -c 'mailto:hello@sensei.nyc')"
          echo "terms/privacy links in app:       $(cat index-*.js 2>/dev/null | grep -c 'Privacy Policy')"
          echo "== crawlable home"
          echo "canonical: $(grep -oE '<link rel="canonical"[^>]*>' home.html)"
          echo "static block: $(grep -c 'class="seo-home"' home.html)  links in it: $(sed -n '/seo:home:start/,/seo:home:end/p' home.html | grep -o '<a href' | wc -l)"
          echo "home counts: $(grep -oE '[0-9]+ licensed shops across [0-9]+ neighborhoods' home.html)"
          curl $C -o wb.html "$B/neighborhoods/williamsburg/"; echo "williamsburg names Hii: $(grep -c 'Hii Williamsburg' wb.html)  shop pages in sitemap: $(curl $C "$B/sitemap.xml" | grep -o '/dispensaries/[^<]*' | wc -l)"

      - name: SEO page
        run: |
          set +e
          B="https://$HOST"
          C='-sS -H Cache-Control:no-cache -H Pragma:no-cache'
          curl $C -D - -o seo.html "$B/dispensaries/qube-manhattan/" | grep -iE '^(HTTP|age|x-vercel-cache|last-modified)'
          echo "new disclaimer:   $(grep -c 'not affiliated with any dispensary' seo.html)"
          echo "old disclaimer:   $(grep -c 'is a guide for adults 21 and over in New York State' seo.html)"
          echo "desktop sidebar:  $(grep -c 'class="lay"' seo.html)"
          echo "directions link:  $(grep -c 'Directions in Google Maps' seo.html)"
          echo "new icon tags:    $(grep -c 'href="/apple-touch-icon.png"' seo.html)"
          echo "envelope mailto:  $(grep -c 'href="mailto:hello@sensei.nyc"' seo.html)"
          echo "drop row in menu: $(sed -n '/id="menu"/,$p' seo.html | grep -ci 'weekly drop')"
          echo "legal links:      $(grep -c 'class="legal-links"' seo.html)"
          echo "sign-up link:     $(grep -c 'id="drop-open"' seo.html)  old box: $(grep -c 'notice drop' seo.html)"
          for p in /terms/ /privacy/ /about/; do
            curl $C -o legal.html -w "%{http_code}  $p  " "$B$p"; echo "$(grep -oE '<h1>[^<]*</h1>' legal.html)  back bar: $(grep -c 'class="sh-bar"' legal.html)  exit pill: $(grep -c 'class="sf-pill"' legal.html)"
          done

      - name: Icons, manifest, service worker
        run: |
          set +e
          B="https://$HOST"
          C='-sS -H Cache-Control:no-cache -H Pragma:no-cache'
          for p in /favicon.ico /favicon.svg /apple-touch-icon.png /icon-192.png /icon-512.png /icon-maskable-512.png /manifest.webmanifest /sw.js; do
            curl $C -o /dev/null -w "%{http_code}  %{content_type}  %{size_download}B  $p\n" "$B$p"
          done
          echo "== favicon.svg starts with"; curl $C "$B/favicon.svg" | head -c 160; echo
          echo "== manifest"; curl $C "$B/manifest.webmanifest"; echo
          echo "== service worker cache id"; curl $C "$B/sw.js" | grep -oE 'setCacheNameDetails\(\{[^}]*\}\)|cleanupOutdatedCaches' | sort -u

      - name: Sitemap dates and redirects
        run: |
          set +e
          B="https://$HOST"
          C='-sS -H Cache-Control:no-cache -H Pragma:no-cache'
          echo "== sitemap: URLs per lastmod date"
          curl $C "$B/sitemap.xml" | grep -oE '<lastmod>[^<]+' | sort | uniq -c
          echo "== redirects in app/vercel.json (expect 301 to the listed destination)"
          python3 - <<'PY'
          import json, subprocess, os
          cfg = json.load(open("app/vercel.json"))
          rules = cfg.get("redirects", [])
          print(f"{len(rules)} rule(s)")
          bad = 0
          for r in rules:
              out = subprocess.run(["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code} %{redirect_url}",
                                    f"https://{os.environ['HOST']}{r['source']}"], capture_output=True, text=True).stdout
              code, _, loc = out.partition(" ")
              ok = code == "301" and loc.rstrip("/").endswith(r["destination"].rstrip("/"))
              bad += not ok
              print(("ok  " if ok else "BAD ") + f"{r['source']} -> {code} {loc}")
          print("all redirects ok" if not bad else f"{bad} redirect(s) wrong")
          PY

      - name: Public API (what the app calls with the public key)
        run: |
          set +e
          KEY=$(python3 -c "import re;print(re.search(r'\"(eyJ[^\"]+)\"',open('seo/build.py').read()).group(1))")
          U="https://dywrisybvcorpfhbwgtg.supabase.co/rest/v1"
          H="-H apikey:$KEY -H Authorization:Bearer\ $KEY"
          echo "== rpc/site_stats"; curl -sS -X POST "$U/rpc/site_stats" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' -w "\nHTTP %{http_code} %{time_total}s\n"
          echo "== live_stores (count)"; curl -sS "$U/live_stores?select=slug" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o ls.json -w "HTTP %{http_code} %{time_total}s\n"; python3 -c "import json;d=json.load(open('ls.json'));print(len(d) if isinstance(d,list) else d)"
          echo "== stores (count, old path)"; curl -sS "$U/stores?select=slug&active=eq.true" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o st.json -w "HTTP %{http_code}\n"; python3 -c "import json;d=json.load(open('st.json'));print(len(d) if isinstance(d,list) else d)"
