name: Weekly report

# Runs in the cloud (open network), so it can reach PostHog + Google Search
# Console — which the interactive sessions can't. Pulls the stats, stores them
# in Supabase (when the service key is set), publishes a snapshot to the
# report-data branch, and emails the summary. Manual runs always email.
#
# Day-to-day "what are the stats?" is served by the first-party beacon
# (pageviews/events tables + traffic_stats/usage_stats) and needs none of this.

on:
  # Manual-only for now. Without the GitHub secrets (PostHog key, Supabase
  # service key, GSC JSON) a scheduled run pulls nothing useful, and its
  # force-push to report-data triggers a failing Vercel preview build each day.
  # Re-add a schedule (e.g. cron "0 11 * * *") once secrets are in place.
  workflow_dispatch:
    inputs:
      posthog_key:
        description: "One-off PostHog personal key (overrides the secret for this run)"
        required: false
      posthog_project:
        description: "One-off PostHog project id"
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r reports/requirements.txt

      - name: Decide whether to email (Mondays, or manual runs)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "REPORT_SEND_EMAIL=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_SEND_EMAIL=0" >> "$GITHUB_ENV"
          fi

      - name: Pull + summarize
        env:
          WINDOW_DAYS: "7"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTHOG_API_KEY: ${{ inputs.posthog_key || secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ inputs.posthog_project || secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: |
          python reports/pull.py
          python reports/summarize.py

      - name: Publish snapshot to report-data branch (so it can be read back)
        if: always()
        run: |
          test -f reports/out/week.json || exit 0
          cp reports/out/week.json /tmp/report-latest.json
          git config user.name "sensei-report-bot"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan report-data 2>/dev/null || git checkout report-data
          git reset --hard 2>/dev/null || true
          cp /tmp/report-latest.json report-latest.json
          git add report-latest.json
          git commit -m "report snapshot $(date -u +%FT%TZ)" || echo "no change"
          git push -f origin report-data
