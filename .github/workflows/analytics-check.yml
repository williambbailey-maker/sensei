name: Analytics check

# End-to-end check of visit tracking on the live site. Six visits, all
# marked internal with ?me=1 so they never count in any report:
#   1. a phone visitor from a Meta-tagged link who taps a deal (app)
#   2. a phone visitor on /deals who picks a product type and opens a deal
#   3. a phone visitor on a static page from a ?src= link
#   4. a bare headless browser, which must NOT be recorded
#   5. a phone visitor who answers "I'm under 21" at the age check
#   6. a phone visitor from an ad link to /start who answers Yes there and
#      must land in the app at / with the same query string and no sheet
#      (the step fails the run if not)
# Visit 1 also scrolls the home and stays 10+ seconds, so the age-check,
# scroll and time-on-site events are exercised too.
# Each carries this run's id; check the rows afterwards with
#   select * from pageviews where utm_content like 'check-<run id>%' or src like 'check-<run id>%';
on:
  workflow_dispatch:

jobs:
  visit:
    # Pinned: Playwright's browser dependencies don't install on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Install a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Visit sensei.nyc
        env:
          RUN: ${{ github.run_id }}
        run: |
          cd /tmp/pw && cat > visit.cjs <<'JS'
          const { chromium } = require('playwright')
          const RUN = process.env.RUN
          const UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          async function visit(b, url, person, act, gate = 'yes') {
            const ctx = await b.newContext(person ? { userAgent: UA, viewport: { width: 390, height: 800 }, isMobile: true } : {})
            if (person) await ctx.addInitScript(() => Object.defineProperty(Navigator.prototype, 'webdriver', { get: () => false }))
            const p = await ctx.newPage()
            const sent = []
            p.on('request', (r) => { const m = r.url().match(/rest\/v1\/(pageviews|events)/); if (m && r.method() === 'POST') { const d = JSON.parse(r.postData() || '{}'); sent.push(m[1] + ':' + (d.event ? d.event + (d.props && d.props.pct ? '@' + d.props.pct : d.props && d.props.seconds ? '@' + d.props.seconds + 's' : '') : 'view')) } })
            await p.goto(url, { waitUntil: 'networkidle' })
            // By role: the sheet's heading also reads "Are you 21 or older?".
            const answer = gate === 'no' ? p.getByRole('link', { name: /under 21/ }).first() : p.getByRole('button', { name: /21 or older/ }).first()
            if (gate !== 'none' && (await answer.isVisible().catch(() => false))) { await answer.click(); await p.waitForTimeout(800) }
            if (act) await act(p)
            await p.waitForTimeout(2500)
            console.log((person ? 'person  ' : 'headless') + '  ' + url + '\n          sent: ' + (sent.join(', ') || 'nothing'))
            await ctx.close()
          }
          ;(async () => {
            const b = await chromium.launch()
            await visit(b, `https://sensei.nyc/?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}&fbclid=check`, true, async (p) => {
              for (let i = 1; i <= 10; i++) { await p.evaluate((f) => window.scrollTo(0, (document.documentElement.scrollHeight - innerHeight) * f), i / 10); await p.waitForTimeout(200) }
              await p.waitForTimeout(10000)
              const row = p.locator('#deals .board-row').first()
              if (await row.count()) { await row.click(); await p.waitForTimeout(800); console.log('          tapped the first deal; product detail open: ' + (await p.getByRole('dialog').isVisible().catch(() => false))) } else console.log('          no deals board to tap')
            })
            await visit(b, `https://sensei.nyc/deals?me=1&src=check-${RUN}`, true, async (p) => {
              await p.locator('.results-list .row').first().waitFor({ timeout: 15000 }).catch(() => {})
              console.log('          /deals: ' + (await p.locator('.meta').first().textContent()) + ' · tabs: ' + (await p.locator('.deal-types .tab').allTextContents()).join(' / '))
              const tab = p.locator('.deal-types .tab').nth(1)
              if (await tab.count()) { await tab.click(); await p.waitForTimeout(400) }
              const row = p.locator('.results-list .row').first()
              if (await row.count()) { await row.click(); await p.waitForTimeout(800); console.log('          tapped a deal; product detail open: ' + (await p.getByRole('dialog').isVisible().catch(() => false))) } else console.log('          no deals to tap')
            })
            await visit(b, `https://sensei.nyc/brands/wyld/?me=1&src=check-${RUN}`, true)
            await visit(b, `https://sensei.nyc/?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}-headless`, false)
            await visit(b, `https://sensei.nyc/?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}-under21`, true, null, 'no')
            // The ad entry page: answer Yes there; the app must open at / with the
            // query string untouched and must not ask again.
            await visit(b, `https://sensei.nyc/start?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}-start&fbclid=check`, true, async (p) => {
              const q = new URL(p.url()).search
              console.log('          /start: ' + (await p.title()))
              await Promise.all([p.waitForURL((u) => u.pathname === '/', { timeout: 15000 }), p.getByRole('button', { name: /21 or older/ }).click()])
              await p.waitForLoadState('networkidle')
              const u = new URL(p.url()), sheet = await p.locator('.agesheet').isVisible().catch(() => false)
              const good = u.pathname === '/' && u.search === q && !sheet
              console.log('          after Yes: ' + u.pathname + u.search + ' · query kept: ' + (u.search === q) + ' · sheet shown: ' + sheet)
              if (!good) { console.log('          FAIL: /start did not hand over cleanly'); process.exitCode = 1 }
            }, 'none')
            await b.close()
            console.log(`\nRun id: ${RUN}`)
          })()
          JS
          node visit.cjs
