name: Analytics check

# End-to-end check of visit tracking on the live site. Three visits, all
# marked internal with ?me=1 so they never count in any report:
#   1. a phone visitor from a Meta-tagged link who taps a deal (app)
#   2. a phone visitor on a static page from a ?src= link
#   3. a bare headless browser, which must NOT be recorded
# Each carries this run's id; check the rows afterwards with
#   select * from pageviews where utm_content like 'check-<run id>%' or src like 'check-<run id>%';
on:
  workflow_dispatch:

jobs:
  visit:
    # Pinned: Playwright's browser dependencies don't install on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Install a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Visit sensei.nyc
        env:
          RUN: ${{ github.run_id }}
        run: |
          cd /tmp/pw && cat > visit.cjs <<'JS'
          const { chromium } = require('playwright')
          const RUN = process.env.RUN
          const UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          async function visit(b, url, person, act) {
            const ctx = await b.newContext(person ? { userAgent: UA, viewport: { width: 390, height: 800 }, isMobile: true } : {})
            if (person) await ctx.addInitScript(() => Object.defineProperty(Navigator.prototype, 'webdriver', { get: () => false }))
            const p = await ctx.newPage()
            const sent = []
            p.on('request', (r) => { const m = r.url().match(/rest\/v1\/(pageviews|events)/); if (m && r.method() === 'POST') sent.push(m[1] + ':' + ((JSON.parse(r.postData() || '{}').event) || 'view')) })
            await p.goto(url, { waitUntil: 'networkidle' })
            const yes = p.getByText(/21 or older/).first()
            if (await yes.isVisible().catch(() => false)) { await yes.click(); await p.waitForTimeout(800) }
            if (act) await act(p)
            await p.waitForTimeout(2500)
            console.log((person ? 'person  ' : 'headless') + '  ' + url + '\n          sent: ' + (sent.join(', ') || 'nothing'))
            await ctx.close()
          }
          ;(async () => {
            const b = await chromium.launch()
            await visit(b, `https://sensei.nyc/?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}&fbclid=check`, true, async (p) => {
              const row = p.locator('#deals .board-row').first()
              if (await row.count()) { await row.click(); console.log('          tapped the first deal') } else console.log('          no deals board to tap')
            })
            await visit(b, `https://sensei.nyc/brands/wyld/?me=1&src=check-${RUN}`, true)
            await visit(b, `https://sensei.nyc/?me=1&utm_source=meta&utm_medium=paid&utm_campaign=analytics-check&utm_content=check-${RUN}-headless`, false)
            await b.close()
            console.log(`\nRun id: ${RUN}`)
          })()
          JS
          node visit.cjs
